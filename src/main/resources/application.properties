spring.application.name=morphia-3d

spring.datasource.url=${DB_URL}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Schema changes are executed by an explicit Flyway deployment job, never by API startup.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration

# Multipart request cap covers eight 10 MiB images, one 50 MiB model, and multipart overhead.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=135MB

# Designer media validation defaults (8 images, each at most 10 MiB; GLB at most 50 MiB).
media.upload.image-max-bytes=10485760
media.upload.max-images=8
media.upload.model-max-bytes=52428800
media.upload.decoded-pixel-max=40000000

# Cloudinary SDK request bounds: connect/connection-pool acquire and response wait (milliseconds).
media.storage.connect-timeout-millis=5000
media.storage.connection-request-timeout-millis=5000
media.storage.request-timeout-millis=60000

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

vnpay.tmn-code=${VNPAY_CODE}
vnpay.hash-secret=${VNPAY_SECRET}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
vnpay.version=2.1.0
vnpay.command=pay
vnpay.curr-code=VND
vnpay.locale=vn

momo.partner-code=${MOMO_PARTNER_CODE}
momo.access-key=${MOMO_ACCESS_KEY}
momo.secret-key=${MOMO_SECRET_KEY}
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
momo.redirect-url=${MOMO_RETURN_URL:http://localhost:8080/api/payments/momo/return}
momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/api/payments/momo/ipn}
momo.request-type=captureWallet

cloudinary.cloud-name=${CLOUD_NAME}
cloudinary.api-key=${API_KEY}
cloudinary.api-secret=${API_SECRET}
cloudinary.base-url=https://res.cloudinary.com/${CLOUD_NAME}/image/upload
